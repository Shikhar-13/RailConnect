server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - name: RemoveRequestHeader
          args:
            name: Cookie

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        - id: auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: trainservice
          uri: lb://trainservice
          predicates:
            - Path=/api/trains/**,/api/stations/**,/api/internal/**
          filters:
            - StripPrefix=0

        # - id: stationservice
        #   uri: lb://trainservice
        #   predicates:
        #     - Path=/api/stations/**
        #   filters:
        #     - StripPrefix=0

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**,/api/tatkal/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
  health:
    show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/