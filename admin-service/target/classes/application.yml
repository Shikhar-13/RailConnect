server:
  port: 8086

spring:
  application:
    name: admin-service

# JWT Configuration (shared with User Service)
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

# Eureka Client Configuration
